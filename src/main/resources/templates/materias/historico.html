<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EduGame - Histórico de Batalhas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e2e; color: #cdd6f4; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        table { width: 100%; border-collapse: collapse; background: #313244; border-radius: 12px; overflow: hidden; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #45475a; }
        th { background-color: #38394c; color: #89b4fa; text-transform: uppercase; font-size: 0.8em; }
        .badge-materia { padding: 5px 10px; border-radius: 20px; color: #11111b; font-weight: bold; font-size: 0.8em; }
        .redacao-badge { color: #fab387; font-weight: bold; }
        .btn-deletar { background: rgba(243, 139, 168, 0.15); color: #f38ba8; border: 1px solid #f38ba8; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-deletar:hover { background: #f38ba8; color: #11111b; }
        
        /* O Novo Botão de Editar */
        .btn-editar { background: rgba(249, 226, 175, 0.15); color: #f9e2af; border: 1px solid #f9e2af; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; text-decoration: none; font-size: 0.9em; display: inline-block; }
        .btn-editar:hover { background: #f9e2af; color: #11111b; }
    </style>
</head>
<body>
    <div class="container">
        <div th:replace="~{fragmentos/navbar :: navbar}"></div>
        <h1>📜 Histórico de Batalhas</h1>

        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Matéria</th>
                    <th>Assunto</th>
                    <th>Tempo</th>
                    <th>Desempenho</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${sessoes}">
                    <td th:text="${#temporals.format(s.dataSessao, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td>
                        <span class="badge-materia" 
                              th:style="'background-color:' + ${s.materia.corHex}" 
                              th:text="${s.materia.nome}">Física</span>
                    </td>
                    <td th:text="${s.assunto}">Leis de Newton</td>
                    <td th:text="${s.tempoMinutos} + ' min'">60 min</td>
                    <td>
                        <div th:if="${s.teveRedacao}">
                            <span class="redacao-badge">📝 Nota: <span th:text="${s.notaRedacao}">1000</span></span>
                        </div>
                        <div th:unless="${s.teveRedacao}">
                            🎯 <span th:text="${s.questoesAcertos}">0</span> / <span th:text="${s.questoesFeitas}">0</span> acertos
                        </div>
                    </td>
                    <td>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <a th:href="@{/materias/historico/editar/{id}(id=${s.id})}" class="btn-editar">✏️ Editar</a>
                            
                            <form th:action="@{/materias/historico/deletar}" method="post" 
                                  onsubmit="return confirm('ATENÇÃO: Tens a certeza que queres anular este registo? A tua EXP, o Nível e os Ranks vão ser recalculados para baixo!');" 
                                  style="margin: 0;">
                                <input type="hidden" name="sessaoId" th:value="${s.id}">
                                <button type="submit" class="btn-deletar">🗑️ Anular</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
