<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="navbar" class="game-navbar">
        <style>
            .game-navbar {
                background: #181825; /* Fundo mais escuro */
                border-bottom: 2px solid #45475a;
                padding: 15px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }
            .nav-brand {
                font-size: 1.5rem;
                font-weight: bold;
                color: #cba6f7;
                text-decoration: none;
                letter-spacing: 1px;
            }
            .nav-links {
                display: flex;
                gap: 15px;
                align-items: center;
            }
            .nav-links a {
                color: #a6adc8;
                text-decoration: none;
                font-weight: bold;
                padding: 8px 12px;
                border-radius: 8px;
                transition: 0.3s;
            }
            .nav-links a:hover, .nav-links a.active {
                background: #313244;
                color: #f9e2af;
            }
            .nav-logout {
                background: #f38ba8;
                color: #11111b;
                border: none;
                padding: 8px 15px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                transition: 0.3s;
                margin-left: 10px;
            }
            .nav-logout:hover {
                background: #e78284;
            }
            
            /* Responsividade para telemóvel */
            @media (max-width: 768px) {
                .game-navbar { flex-direction: column; gap: 15px; padding: 15px; }
                .nav-links { flex-wrap: wrap; justify-content: center; }
            }
        </style>
        
        <a href="/dashboard" class="nav-brand">🛡️ EduGame</a>
        
        <div class="nav-links">
            <a href="/dashboard">📊 Painel</a>
            <a href="/materias">⚔️ Laboratório</a>
            <a href="/materias/historico">📜 Histórico</a>
            <a href="/perfil">👤 Ficha do Caçador</a>
            
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="nav-logout">Sair</button>
            </form>
        </div>
    </div>
</body>
</html>
