# 1. IMPORTAR O COFRE PRIMEIRO!
spring.config.import=optional:file:segredos.properties

# ===============================
# CONFIGURAÇÃO DO BANCO DE DADOS (PostgreSQL Nuvem)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURAÇÃO DO HIBERNATE / JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# ===============================
# CONFIGURAÇÃO DE ENVIO DE E-MAIL (GMAIL)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_JOGO}
spring.mail.password=${SENHA_JOGO}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true