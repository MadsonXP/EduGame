<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EduGame - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #45475a; padding-bottom: 15px; }
        
        /* Grid de Cartões de Status */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #313244; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid #89b4fa; }
        .card h3 { font-size: 0.9rem; color: #a6adc8; margin: 0; }
        .card .value { font-size: 2rem; font-weight: bold; color: #f9e2af; }

        /* Área de Gráficos */
        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 30px; }
        .chart-box { background: #313244; padding: 20px; border-radius: 15px; }
        
        button { background: #f38ba8; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; color: #11111b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Painel do Caçador: <span th:text="${usuario.nome}">Nome</span></h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Sair do Jogo</button>
        </form>
    </div>

    <div class="stats-grid">
        <div class="card"><h3>Nível</h3><div class="value" th:text="${usuario.nivel}">1</div></div>
        <div class="card"><h3>Questões</h3><div class="value" th:text="${totalQuestoes}">0</div></div>
        <div class="card"><h3>Horas Foco</h3><div class="value" th:text="${totalHoras}">0</div></div>
        <div class="card"><h3>Redações</h3><div class="value" th:text="${totalRedacoes}">0</div></div>
    </div>

    <div class="charts-container">
        <div class="chart-box">
            <h3 style="text-align: center;">Questões por Matéria</h3>
            <canvas id="chartQuestoes"></canvas>
        </div>
        <div class="chart-box" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h3>Deseja iniciar um novo treino?</h3>
            <a href="/materias" style="background:#a6e3a1; color:#11111b; padding:15px 30px; border-radius:8px; text-decoration:none; font-weight:bold;">IR PARA MATÉRIAS</a>
        </div>
    </div>

    <script th:inline="javascript">
        // Pegando os dados do Java para o JavaScript
       const labels = /*[[${labelsMaterias}]]*/ [];
const dados = /*[[${dadosQuestoes}]]*/ [];

        const ctx = document.getElementById('chartQuestoes').getContext('2d');
        new Chart(ctx, {
            type: 'bar', // Pode ser 'pie', 'line', 'bar'
            data: {
                labels: labels,
                datasets: [{
                    label: 'Questões Resolvidas',
                    data: dados,
                    backgroundColor: ['#89b4fa', '#f38ba8', '#a6e3a1', '#fab387', '#f9e2af'],
                    borderWidth: 0
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#45475a' } } }
            }
        });
    </script>
</body>
</html>
