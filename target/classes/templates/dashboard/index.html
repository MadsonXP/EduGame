<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EduGame - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Estilos Gerais do Tema Dark */
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #45475a; padding-bottom: 15px; }
        
        /* Cards Superiores */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #313244; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid #89b4fa; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h3 { font-size: 0.9rem; color: #a6adc8; margin: 0; }
        .card .value { font-size: 2rem; font-weight: bold; color: #f9e2af; margin-top: 10px; }

        /* Layout dos Gráficos */
        .charts-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 30px; }
        .chart-box { background: #313244; padding: 25px; border-radius: 15px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-header h3 { margin: 0; color: #cdd6f4; }
        
        /* Componentes de Interface */
        .filtro-select { background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; padding: 8px 12px; border-radius: 8px; outline: none; cursor: pointer; }
        .btn-treino { background: linear-gradient(45deg, #a6e3a1, #94e2d5); color:#11111b; padding:12px 20px; border-radius:8px; text-decoration:none; font-weight:bold; margin-top: 25px; width: 80%; text-align: center; display: inline-block; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-treino:hover { transform: translateY(-3px); box-shadow: 0 6px 8px rgba(0,0,0,0.3); }
        .btn-sair { background: #f38ba8; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; color: #11111b; font-weight: bold; transition: background 0.3s; }
        .btn-sair:hover { background: #e78284; }
        
        /* Ajuste para mobile */
        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

   <div th:replace="~{fragmentos/navbar :: navbar}"></div>

    <h1 style="margin-bottom: 20px;">Painel do Caçador: <span th:text="${usuario.nome}" style="color: #f9e2af;">Nome</span></h1>

    <div class="stats-grid">
        <div class="card" style="border-color: #f9e2af;"><h3>Nível Atual</h3><div class="value" th:text="${usuario.nivel}">1</div></div>
        <div class="card" style="border-color: #a6e3a1;"><h3>Total Questões</h3><div class="value" th:text="${totalQuestoes}">0</div></div>
        <div class="card" style="border-color: #89b4fa;"><h3>Horas Foco</h3><div class="value" th:text="${totalHoras}">0</div></div>
        <div class="card" style="border-color: #fab387;"><h3>Redações Entregues</h3><div class="value" th:text="${totalRedacoes}">0</div></div>
    </div>

    <div class="charts-container">
        <div class="chart-box">
            <div class="chart-header">
                <h3>Evolução de Questões</h3>
                <select id="filtroTempo" class="filtro-select" onchange="atualizarGraficoQuestoes()">
                    <option value="dia" selected>Visão por Dia</option>
                    <option value="mes">Visão por Mês</option>
                </select>
            </div>
            <div style="height: 350px; position: relative;">
                <canvas id="chartQuestoes"></canvas>
            </div>
        </div>

        <div class="chart-box" style="display: flex; flex-direction: column; align-items: center; justify-content: space-between;">
            <h3 style="margin-top: 0;">Foco por Matéria (Horas)</h3>
            <div style="height: 250px; position: relative; width: 100%; display: flex; justify-content: center;">
                 <canvas id="chartHoras"></canvas>
            </div>
            
            <a href="/materias" class="btn-treino">
                ⚔️ INICIAR NOVA MISSÃO
            </a>
        </div>
    </div>

    <div class="charts-container" style="grid-template-columns: 1fr; margin-top: 20px;">
        <div class="chart-box">
            <h3 style="margin: 0 0 20px 0;">Desempenho em Redação (Notas XP)</h3>
            <div style="height: 300px; position: relative;">
                <canvas id="chartRedacao"></canvas>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // --- RECEBENDO DADOS DO BACKEND (JAVA) ---
        const sessoes = /*[[${dadosSessoes}]]*/ [];
        const nomesMaterias = /*[[${nomesMaterias}]]*/ [];
        const coresMaterias = /*[[${coresMaterias}]]*/ [];
        const horasPorMateria = /*[[${horasPorMateria}]]*/ [];
        const dadosRedacoes = /*[[${dadosRedacoes}]]*/ [];

        // Configuração comum para cores de texto e grelha no tema escuro
        Chart.defaults.color = '#a6adc8';
        Chart.defaults.borderColor = '#45475a';

        // ----------------------------------------------------
        // 1. GRÁFICO DE ROSQUINHA (HORAS ESTUDADAS)
        // ----------------------------------------------------
        const ctxHoras = document.getElementById('chartHoras').getContext('2d');
        new Chart(ctxHoras, {
            type: 'doughnut',
            data: {
                labels: nomesMaterias,
                datasets: [{
                    data: horasPorMateria,
                    backgroundColor: coresMaterias,
                    borderColor: '#313244',
                    borderWidth: 2,
                    hoverOffset: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true } },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return ' ' + context.label + ': ' + context.parsed.toFixed(1) + ' horas';
                            }
                        }
                    }
                }
            }
        });

        // ----------------------------------------------------
        // 2. GRÁFICO DE BARRAS EMPILHADAS (QUESTÕES) - AJUSTADO
        // ----------------------------------------------------
        let chartQuestoesInstance = null;

        function atualizarGraficoQuestoes() {
            const filtro = document.getElementById('filtroTempo').value;
            const labelsDatas = new Set();
            const dadosAgrupados = {};

            nomesMaterias.forEach(m => dadosAgrupados[m] = {});

            // INSERINDO OS ÚLTIMOS 7 DIAS (OU 6 MESES) PARA O GRÁFICO NÃO FICAR VAZIO/LARGO
            const hoje = new Date();
            if (filtro === 'dia') {
                for (let i = 6; i >= 0; i--) {
                    let d = new Date();
                    d.setDate(hoje.getDate() - i);
                    let ano = d.getFullYear();
                    let mes = String(d.getMonth() + 1).padStart(2, '0');
                    let dia = String(d.getDate()).padStart(2, '0');
                    labelsDatas.add(`${ano}-${mes}-${dia}`); // Formato YYYY-MM-DD
                }
            } else {
                for (let i = 5; i >= 0; i--) {
                    let d = new Date();
                    d.setMonth(hoje.getMonth() - i);
                    let ano = d.getFullYear();
                    let mes = String(d.getMonth() + 1).padStart(2, '0');
                    labelsDatas.add(`${ano}-${mes}`); // Formato YYYY-MM
                }
            }

            // Agrupa os dados de cada batalha/sessão real que você fez
            sessoes.forEach(s => {
                let dataFormatada = s.data;
                if (filtro === 'mes') dataFormatada = dataFormatada.substring(0, 7);
                
                labelsDatas.add(dataFormatada); // Garante que dias antigos também entrem no gráfico

                if(!dadosAgrupados[s.materia][dataFormatada]) dadosAgrupados[s.materia][dataFormatada] = 0;
                dadosAgrupados[s.materia][dataFormatada] += s.questoes;
            });

            // Ordena todas as datas cronologicamente
            const labelsEixoX = Array.from(labelsDatas).sort();

            const datasets = nomesMaterias.map((materia, index) => {
                const dataArray = labelsEixoX.map(data => dadosAgrupados[materia][data] || 0);
                return {
                    label: materia,
                    data: dataArray,
                    backgroundColor: coresMaterias[index], // Volta a ser cor sólida
                    borderRadius: 4,
                    maxBarThickness: 40 // <--- O TRUQUE DE OURO: Largura máxima de 40px
                };
            });

            if (chartQuestoesInstance) chartQuestoesInstance.destroy();

            const ctxQuestoes = document.getElementById('chartQuestoes').getContext('2d');
            chartQuestoesInstance = new Chart(ctxQuestoes, {
                type: 'bar', // <--- VOLTOU A SER BARRA
                data: {
                    labels: labelsEixoX,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: { 
                            stacked: true, 
                            grid: { display: false } 
                        },
                        y: { 
                            stacked: true, 
                            beginAtZero: true,
                            grid: { color: '#45475a30' }
                        }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 15 } },
                        tooltip: {
                            boxPadding: 6,
                            usePointStyle: true,
                            callbacks: {
                                footer: function(tooltipItems) {
                                    let total = 0;
                                    tooltipItems.forEach(function(tooltipItem) {
                                        total += tooltipItem.parsed.y;
                                    });
                                    return 'Total no Dia: ' + total + ' Questões';
                                }
                            }
                        }
                    }
                }
            });
        }
        atualizarGraficoQuestoes();

        // ----------------------------------------------------
        // 3. GRÁFICO DE LINHAS (NOTAS DA REDAÇÃO)
        // ----------------------------------------------------
        if (dadosRedacoes && dadosRedacoes.length > 0) {
            const labelsRedacao = dadosRedacoes.map(d => d.data);
            const notasRedacao = dadosRedacoes.map(d => d.nota);

            const ctxRedacao = document.getElementById('chartRedacao').getContext('2d');
            new Chart(ctxRedacao, {
                type: 'line',
                data: {
                    labels: labelsRedacao,
                    datasets: [{
                        label: 'Nota Final',
                        data: notasRedacao,
                        borderColor: '#fab387',
                        backgroundColor: 'rgba(250, 179, 135, 0.15)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#fab387',
                        pointBorderColor: '#1e1e2e',
                        pointBorderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 9
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { display: false } },
                        y: { min: 0, max: 1000, ticks: { stepSize: 200 }, grid: { color: '#45475a30' } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            displayColors: false,
                            callbacks: {
                                title: (context) => 'Data: ' + context[0].label,
                                label: (context) => 'Nota Alcançada: ' + context.parsed.y + ' XP'
                            }
                        }
                    }
                }
            });
        } else {
            const containerRedacao = document.getElementById('chartRedacao').parentElement;
            containerRedacao.innerHTML = '<div style="text-align: center; color: #a6adc8; padding: 70px 0; font-style: italic;">' +
                                         'Nenhuma Batalha de Redação registada ainda.<br>O Boss final aguarda! 📝' + 
                                         '</div>';
        }
    </script>
</body>
</html>
